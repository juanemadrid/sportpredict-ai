# =============================================================================
# SPORTPREDICT AI - RENDER BLUEPRINT (DESPLIEGUE EN LA NUBE SIN VPS)
# =============================================================================
# Render aprovisiona el backend como Web Service (Plan Free $0).
# La base de datos y la autenticación residen en Supabase (Plan Free $0).
# El frontend se despliega gratuitamente en Vercel.
# Las ejecuciones de Fase 5 corren automáticamente vía GitHub Actions.

services:
  # Backend API FastAPI
  - type: web
    name: sportpredict-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AUTH_ALLOW_DEV_HEADERS
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: API_FOOTBALL_KEY
        sync: false
